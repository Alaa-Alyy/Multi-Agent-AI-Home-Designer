<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f3e36"/><stop offset="1" stop-color="#4f6355"/></linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8d5b7" stop-opacity="0"/><stop offset="1" stop-color="#e8d5b7" stop-opacity="0.55"/></linearGradient>
    <radialGradient id="lampglow"><stop offset="0" stop-color="#ffe2a8" stop-opacity="0.75"/><stop offset="1" stop-color="#ffe2a8" stop-opacity="0"/></radialGradient>
    <clipPath id="roomclip"><rect x="30" y="30" width="580" height="370" rx="14"/></clipPath>
  </defs>
  <rect width="1000" height="430" rx="18" fill="url(#bg)"/>

  <!-- ROOM -->
  <g clip-path="url(#roomclip)">
    <!-- before: plain walls and floor -->
    <rect x="30" y="30" width="580" height="290" fill="#cfc9c0"/>
    <polygon points="30,320 610,320 610,400 30,400" fill="#a99a86"/>
    <!-- after: sage wall + warm floor -->
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.620;0.640;0.950;0.970;1" dur="14s" repeatCount="indefinite"/>
      <rect x="30" y="30" width="580" height="290" fill="#9fb3a0"/>
      <polygon points="30,320 610,320 610,400 30,400" fill="#b98c62"/>
    </g>
    <!-- window (always) -->
    <rect x="70" y="70" width="120" height="140" rx="6" fill="#dfeef2" stroke="#fbf7f0" stroke-width="6"/>
    <line x1="130" y1="70" x2="130" y2="210" stroke="#fbf7f0" stroke-width="4"/>
    <line x1="70" y1="140" x2="190" y2="140" stroke="#fbf7f0" stroke-width="4"/>

    <!-- before: old grey sofa -->
    <g><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.640;0.670;0.97;1" dur="14s" repeatCount="indefinite"/>
      <rect x="240" y="235" width="240" height="70" rx="8" fill="#8d8a86"/>
      <rect x="240" y="205" width="240" height="40" rx="8" fill="#9b9893"/>
      <rect x="228" y="215" width="24" height="90" rx="8" fill="#7f7c78"/>
      <rect x="468" y="215" width="24" height="90" rx="8" fill="#7f7c78"/>
      <rect x="250" y="305" width="10" height="16" fill="#6c6966"/><rect x="460" y="305" width="10" height="16" fill="#6c6966"/>
    </g>

    <!-- after: new design -->
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.640;0.660;0.950;0.970;1" dur="14s" repeatCount="indefinite"/>
      <ellipse cx="360" cy="360" rx="210" ry="30" fill="#e8d5b7" opacity="0.9"/>
      <rect x="235" y="225" width="250" height="78" rx="18" fill="#c0663f"/>
      <rect x="245" y="192" width="230" height="48" rx="16" fill="#cf7a52"/>
      <rect x="222" y="210" width="30" height="93" rx="14" fill="#a9532f"/>
      <rect x="468" y="210" width="30" height="93" rx="14" fill="#a9532f"/>
      <rect x="262" y="215" width="70" height="42" rx="10" fill="#e8d5b7"/>
      <rect x="388" y="215" width="70" height="42" rx="10" fill="#9fb3a0" stroke="#fbf7f0" stroke-width="2"/>
      <rect x="250" y="303" width="8" height="18" fill="#5b3a26"/><rect x="462" y="303" width="8" height="18" fill="#5b3a26"/>
    </g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.670;0.690;0.950;0.970;1" dur="14s" repeatCount="indefinite"/>
      <rect x="300" y="80" width="120" height="84" rx="4" fill="#fbf7f0" stroke="#5b3a26" stroke-width="5"/>
      <circle cx="340" cy="120" r="20" fill="#c0663f"/>
      <rect x="352" y="100" width="46" height="46" fill="#6b7f6a" opacity="0.85"/>
    </g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.700;0.720;0.950;0.970;1" dur="14s" repeatCount="indefinite"/>
      <path d="M560,320 L560,120 Q560,92 532,92 L512,92" stroke="#2f3e36" stroke-width="6" fill="none"/>
      <rect x="540" y="314" width="40" height="8" rx="3" fill="#2f3e36"/>
      <path d="M492,92 Q512,70 532,92 Z" fill="#e8b04a"/>
      <circle cx="512" cy="110" r="60" fill="url(#lampglow)"/>
    </g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.730;0.750;0.950;0.970;1" dur="14s" repeatCount="indefinite"/>
      <path d="M120,322 L130,282 L170,282 L180,322 Z" fill="#c0663f"/>
      <ellipse cx="137" cy="250" rx="12" ry="32" fill="#4f7a4f" transform="rotate(-25 137 250)"/>
      <ellipse cx="163" cy="246" rx="12" ry="34" fill="#5d8c5a" transform="rotate(22 163 246)"/>
      <ellipse cx="150" cy="238" rx="11" ry="36" fill="#6b9e66"/>
    </g>

    <!-- vision scan -->
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.060;0.070;0.200;0.220;1" dur="14s" repeatCount="indefinite"/>
      <rect x="30" y="-60" width="580" height="60" fill="url(#scan)">
        <animate attributeName="y" values="-60;-60;400;400" keyTimes="0;0.07;0.20;1" dur="14s" repeatCount="indefinite"/>
      </rect>
      <text x="320" y="56" text-anchor="middle" font-size="15" fill="#2f3e36" font-weight="600">analysing room · furniture · light · colours</text>
    </g>

    <!-- before / after label -->
    <g><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.640;0.670;0.97;1" dur="14s" repeatCount="indefinite"/><rect x="44" y="360" width="86" height="28" rx="14" fill="#2f3e36" opacity="0.85"/><text x="87" y="379" text-anchor="middle" font-size="14" fill="#fbf7f0">before</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.640;0.660;0.950;0.970;1" dur="14s" repeatCount="indefinite"/><rect x="44" y="360" width="86" height="28" rx="14" fill="#c0663f"/><text x="87" y="379" text-anchor="middle" font-size="14" fill="#fbf7f0">after ✨</text></g>
  </g>
  <rect x="30" y="30" width="580" height="370" rx="14" fill="none" stroke="#e8d5b7" stroke-opacity="0.5" stroke-width="2"/>

  <!-- AGENTS PANEL -->
  <text x="640" y="34" font-size="13" letter-spacing="2" fill="#e8d5b7" font-weight="700">ROOMLY AI AGENTS</text>
  
    <g>
      <rect x="640" y="48" width="330" height="36" rx="10" fill="#c08a5b" opacity="0">
        <animate attributeName="opacity" values="0;0;0.9;0.9;0.22;0.22;0" keyTimes="0;0.065;0.070;0.200;0.210;0.95;1" dur="14s" repeatCount="indefinite"/>
      </rect>
      <text x="656" y="72" font-size="17">📷</text>
      <text x="688" y="71" font-size="14.5" fill="#fbf7f0">Vision · reads the room</text>
    </g>
    <g>
      <rect x="640" y="92" width="330" height="36" rx="10" fill="#c08a5b" opacity="0">
        <animate attributeName="opacity" values="0;0;0.9;0.9;0.22;0.22;0" keyTimes="0;0.195;0.200;0.300;0.310;0.95;1" dur="14s" repeatCount="indefinite"/>
      </rect>
      <text x="656" y="116" font-size="17">📚</text>
      <text x="688" y="115" font-size="14.5" fill="#fbf7f0">RAG · design knowledge</text>
    </g>
    <g>
      <rect x="640" y="136" width="330" height="36" rx="10" fill="#c08a5b" opacity="0">
        <animate attributeName="opacity" values="0;0;0.9;0.9;0.22;0.22;0" keyTimes="0;0.295;0.300;0.400;0.410;0.95;1" dur="14s" repeatCount="indefinite"/>
      </rect>
      <text x="656" y="160" font-size="17">💰</text>
      <text x="688" y="159" font-size="14.5" fill="#fbf7f0">Budget · splits the budget</text>
    </g>
    <g>
      <rect x="640" y="180" width="330" height="36" rx="10" fill="#c08a5b" opacity="0">
        <animate attributeName="opacity" values="0;0;0.9;0.9;0.22;0.22;0" keyTimes="0;0.395;0.400;0.500;0.510;0.95;1" dur="14s" repeatCount="indefinite"/>
      </rect>
      <text x="656" y="204" font-size="17">🛒</text>
      <text x="688" y="203" font-size="14.5" fill="#fbf7f0">Search · finds real products</text>
    </g>
    <g>
      <rect x="640" y="224" width="330" height="36" rx="10" fill="#c08a5b" opacity="0">
        <animate attributeName="opacity" values="0;0;0.9;0.9;0.22;0.22;0" keyTimes="0;0.495;0.500;0.600;0.610;0.95;1" dur="14s" repeatCount="indefinite"/>
      </rect>
      <text x="656" y="248" font-size="17">🙋</text>
      <text x="688" y="247" font-size="14.5" fill="#fbf7f0">You choose the products</text>
    </g>
    <g>
      <rect x="640" y="268" width="330" height="36" rx="10" fill="#c08a5b" opacity="0">
        <animate attributeName="opacity" values="0;0;0.9;0.9;0.22;0.22;0" keyTimes="0;0.595;0.600;0.760;0.770;0.95;1" dur="14s" repeatCount="indefinite"/>
      </rect>
      <text x="656" y="292" font-size="17">🖼️</text>
      <text x="688" y="291" font-size="14.5" fill="#fbf7f0">DALL·E 3 · renders the room</text>
    </g>
    <g>
      <rect x="640" y="312" width="330" height="36" rx="10" fill="#c08a5b" opacity="0">
        <animate attributeName="opacity" values="0;0;0.9;0.9;0.22;0.22;0" keyTimes="0;0.755;0.760;0.930;0.940;0.95;1" dur="14s" repeatCount="indefinite"/>
      </rect>
      <text x="656" y="336" font-size="17">📦</text>
      <text x="688" y="335" font-size="14.5" fill="#fbf7f0">Final design + costs</text>
    </g>

  <!-- budget bar -->
  <text x="640" y="384" font-size="13" fill="#e8d5b7">budget</text>
  <rect x="700" y="372" width="270" height="16" rx="8" fill="#2f3e36" stroke="#e8d5b7" stroke-opacity="0.5"/>
  <rect x="700" y="372" width="0" height="16" rx="8" fill="#e8d5b7">
    <animate attributeName="width" values="0;0;220;220;0" keyTimes="0;0.30;0.40;0.95;1" dur="14s" repeatCount="indefinite"/>
  </rect>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.780;0.800;0.950;0.970;1" dur="14s" repeatCount="indefinite"/>
    <text x="970" y="412" text-anchor="end" font-size="13.5" fill="#fbf7f0" font-weight="600">✓ within budget</text>
  </g>
</svg>
