services:
  - type: web
    name: roomly-ai
    runtime: docker
    plan: free
    rootDir: roomly-ai/roomly-ai
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
