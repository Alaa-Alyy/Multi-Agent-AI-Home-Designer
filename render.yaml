services:
  - type: web
    name: roomly-ai
    runtime: docker
    plan: free
    rootDir: roomly-ai/roomly-ai
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: RAINFOREST_API_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
